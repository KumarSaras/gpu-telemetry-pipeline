{{- if .Values.database.postgresEnabled }}
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-postgres }
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: {{ .Release.Name }}-postgres }
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 70, runAsUser: 70, runAsGroup: 70, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.database.image | quote }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_DB, value: telemetry }
            - { name: POSTGRES_HOST_AUTH_METHOD, value: trust }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: '1', memory: 512Mi } }
          readinessProbe:
            exec: { command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, telemetry] }
            periodSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.database.storageClass }}
        storageClassName: {{ .Values.database.storageClass | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.database.storage | quote }} }
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # Revision name allows a new migration Job on each upgrade without mutating an old Job.
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: migrate }
spec:
  backoffLimit: 8
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: migrate }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: {{ printf "%s/migrate:%s" .Values.images.prefix .Values.images.tag | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: DATABASE_URL
              value: {{ include "gpuTelemetry.databaseURL" . | quote }}
