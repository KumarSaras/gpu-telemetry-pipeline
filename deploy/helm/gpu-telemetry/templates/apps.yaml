{{- if gt (int .Values.collector.slots) (int .Values.queue.maxSlots) }}
{{- fail "collector.slots must not exceed queue.maxSlots" }}
{{- end }}
{{- $root := . }}
{{- range $name := list "queue" "collector" "gateway" "streamer" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels: { app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $name }} }
spec:
  replicas: {{ if eq $name "queue" }}1{{ else if eq $name "collector" }}{{ $root.Values.collector.replicas }}{{ else if eq $name "streamer" }}{{ $root.Values.streamer.replicas }}{{ else }}1{{ end }}
  {{- if eq $name "queue" }}
  strategy: { type: Recreate }
  {{- end }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $name }} }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 25
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: {{ $name }}
          image: {{ printf "%s/%s:%s" $root.Values.images.prefix $name $root.Values.images.tag | quote }}
          imagePullPolicy: {{ $root.Values.images.pullPolicy }}
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          ports:
            - { name: http, containerPort: {{ if eq $name "queue" }}8081{{ else if eq $name "collector" }}8082{{ else if eq $name "streamer" }}8083{{ else }}8080{{ end }} }
            {{- if eq $name "queue" }}
            - { name: grpc, containerPort: 9090 }
            {{- end }}
          env:
            {{- if or (eq $name "collector") (eq $name "streamer") }}
            - { name: QUEUE_URL, value: {{ printf "%s-queue:9090" $root.Release.Name | quote }} }
            {{- end }}
            {{- if ne $name "gateway" }}
            - { name: MAX_MESSAGE_BYTES, value: {{ $root.Values.queue.maxMessageBytes | int64 | quote }} }
            {{- end }}
            {{- if eq $name "queue" }}
            - { name: ACK_TIMEOUT, value: {{ $root.Values.queue.ackTimeout | quote }} }
            - { name: QUEUE_MAX_SLOTS, value: {{ $root.Values.queue.maxSlots | int64 | quote }} }
            - { name: QUEUE_MAX_MESSAGES, value: {{ $root.Values.queue.maxMessages | int64 | quote }} }
            - { name: QUEUE_MAX_BYTES, value: {{ $root.Values.queue.maxBytes | int64 | quote }} }
            - { name: QUEUE_MAX_SUBSCRIBERS, value: {{ $root.Values.queue.maxSubscribers | int64 | quote }} }
            {{- end }}
            {{- if eq $name "collector" }}
            - { name: COLLECTOR_SLOTS, value: {{ $root.Values.collector.slots | int64 | quote }} }
            {{- end }}
            {{- if or (eq $name "collector") (eq $name "gateway") }}
            - name: DATABASE_URL
              value: {{ include "gpuTelemetry.databaseURL" $root | quote }}
            {{- end }}
            {{- if eq $name "streamer" }}
            - { name: STREAM_INTERVAL, value: {{ $root.Values.streamer.interval | quote }} }
            - { name: STREAM_LOOP, value: {{ $root.Values.streamer.loop | quote }} }
            {{- end }}
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
          startupProbe:
            httpGet: { path: /livez, port: http }
            failureThreshold: 30
            periodSeconds: 2
{{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-queue }
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: queue }
  ports: [{ name: grpc, port: 9090, targetPort: grpc }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-gateway }
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway }
  ports: [{ name: http, port: 8080, targetPort: http }]
